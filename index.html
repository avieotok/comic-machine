<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הפוך את התמונה שלך לקומיקס!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Karantina:wght@700&family=Secular+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffd60a">
  <meta name="description" content="הופכים כל תמונה לקומיקס: 8 סגנונות, בועות דיבור, צילום מהמצלמה והורדה. עובד בדפדפן בלי שרת.">
</head>
<body>
  <div class="app-frame">
    <header class="header-banner">
      <div class="burst-badge wow">WOW!</div>
      <h1>הפוך את התמונה שלך לקומיקס!</h1>
      <div class="burst-badge">BOOM!</div>
    </header>

    <main class="main-grid">
      <section class="controls-panel">
        <h2 class="section-title"><span class="num">1</span> התמונה</h2>
        <div class="upload-box" id="dropZone">
          <img id="miniThumb" class="upload-preview-mini" alt="התמונה שנבחרה" />
          <div>
            <p class="upload-title">גררו, הדביקו או העלו תמונה</p>
            <button type="button" class="btn-file" id="selectFileBtn">בחירת קובץ</button>
            <button type="button" class="btn-file btn-camera" id="cameraBtn">📷 צילום</button>
            <button type="button" class="btn-small" id="sampleBtn">תמונת דוגמה</button>
          </div>
          <input type="file" id="fileInput" accept="image/*" hidden />
          <input type="file" id="captureInput" accept="image/*" capture="environment" hidden />
        </div>

        <h2 class="section-title"><span class="num">2</span> סגנון קומיקס</h2>
        <div class="style-gallery" id="gallery"></div>

        <h2 class="section-title"><span class="num">3</span> פריסת דף</h2>
        <div class="layout-row" id="layouts"></div>

        <div class="sliders-group">
          <div class="slider-row">
            <label for="edgeRange">עובי קווי הדיו</label>
            <input type="range" id="edgeRange" min="0" max="100" value="50" />
          </div>
          <div class="slider-row">
            <label for="smoothRange">החלקה (מראה מצויר)</label>
            <input type="range" id="smoothRange" min="0" max="100" value="55" />
          </div>
          <div class="slider-row">
            <label for="colorRange">עוצמת צבע</label>
            <input type="range" id="colorRange" min="0" max="100" value="50" />
          </div>
        </div>

        <h2 class="section-title"><span class="num">4</span> טקסטים</h2>
        <div class="bubbles-inputs">
          <div class="input-group"><label for="bubble1">בועה 1</label><input type="text" id="bubble1" value="וואו! אני בקומיקס!" /></div>
          <select id="kind1" aria-label="סוג בועה 1"><option value="speech">דיבור</option><option value="thought">מחשבה</option><option value="shout">צעקה</option></select>
          <div class="input-group"><label for="bubble2">בועה 2</label><input type="text" id="bubble2" value="רגע... מי צייר אותי?" /></div>
          <select id="kind2" aria-label="סוג בועה 2"><option value="speech">דיבור</option><option value="thought" selected>מחשבה</option><option value="shout">צעקה</option></select>
          <div class="input-group"><label for="sfxText">אפקט קול</label><input type="text" id="sfxText" value="בום!" /></div>
          <span></span>
          <div class="input-group"><label for="captionText">כיתוב עליון</label><input type="text" id="captionText" value="ובינתיים, בעיר..." /></div>
          <span></span>
        </div>
      </section>

      <section class="preview-panel">
        <h2 class="preview-title">התוצאה שלך</h2>
        <div class="canvas-wrapper">
          <canvas id="comicCanvas" width="1200" height="900"></canvas>
          <div class="busy" id="busy">⏳ מצייר...</div>
        </div>
        <p class="hint-text" id="hintText">טוען את תמונת הדוגמה...</p>
        <div class="compare-row">
          <button type="button" class="btn-small" id="compareBtn">👁️ לחיצה ארוכה: לראות את המקור</button>
        </div>
      </section>
    </main>

    <div class="bottom-actions">
      <button type="button" class="action-btn btn-apply" id="applyBtn">✨ החל אפקט קומיקס</button>
      <button type="button" class="action-btn btn-download" id="downloadBtn">⬇️ הורד תמונה</button>
    </div>
  </div>

  <!-- חלון מצלמה -->
  <div class="cam-modal" id="camModal" role="dialog" aria-modal="true" aria-labelledby="camTitle" hidden>
    <div class="cam-box">
      <h2 id="camTitle" class="cam-title">📷 צלמו תמונה</h2>
      <div class="cam-view">
        <video id="camVideo" playsinline muted autoplay></video>
        <div class="cam-count" id="camCount"></div>
        <div class="cam-flash" id="camFlash"></div>
      </div>
      <p class="hint-text" id="camMsg"></p>
      <div class="cam-actions">
        <button type="button" class="action-btn btn-apply" id="snapBtn">📸 צלם</button>
        <button type="button" class="btn-file" id="timerBtn">⏱️ טיימר 3 שניות</button>
        <button type="button" class="btn-file" id="flipBtn">🔄 החלף מצלמה</button>
        <button type="button" class="btn-file" id="camClose">ביטול</button>
      </div>
    </div>
  </div>

<script src="js/sample.js"></script>
<script src="js/app.js"></script>
</body>
</html>
