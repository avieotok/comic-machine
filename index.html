<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffd60a" />
  <title>מכונת קומיקס — הפוך תמונה לקומיקס</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-frame">
    <header class="header-banner">
      <div class="burst-badge wow">WOW!</div>
      <h1>מכונת קומיקס</h1>
      <div class="burst-badge">BOOM!</div>
    </header>

    <main class="main-grid">
      <section class="controls-panel">
        <div class="upload-box" id="dropZone">
          <img id="miniThumb" class="upload-preview-mini" alt="תצוגה מקדימה" />
          <p class="upload-title">גרור או העלה תמונה כאן</p>
          <button type="button" class="btn-file" id="selectFileBtn">בחירת קובץ</button>
          <input type="file" id="fileInput" accept="image/*" hidden />
        </div>

        <div class="settings-grid">
          <div class="style-select-box">
            <label for="styleMode">סגנון הקומיקס</label>
            <select id="styleMode">
              <option value="classic">קלאסי (צבעוני חד)</option>
              <option value="vintage">וינטג' (רטרו חם)</option>
              <option value="bw">שחור-לבן (נואר)</option>
              <option value="pop">פופ-ארט (ניגודיות גבוהה)</option>
            </select>
          </div>

          <div class="sliders-group">
            <div class="slider-row">
              <span>עוצמת קווי מתאר</span>
              <input type="range" id="edgeSlider" min="10" max="100" value="55" />
            </div>
            <div class="slider-row">
              <span>רוויית צבעי קומיקס</span>
              <input type="range" id="colorSlider" min="2" max="10" value="5" />
            </div>
            <div class="slider-row">
              <span>נקודות רשת (Halftone)</span>
              <input type="range" id="dotsSlider" min="0" max="100" value="45" />
            </div>
          </div>
        </div>

        <div class="bubbles-inputs">
          <div class="input-group">
            <label for="speechText">בועת דיבור ראשית</label>
            <input type="text" id="speechText" value="איזה יום מדהים!" placeholder="הקלד טקסט..." />
          </div>
          <div class="input-group">
            <label for="thoughtIcon">בועת מחשבה / אייקון</label>
            <select id="thoughtIcon">
              <option value="📷">מצלמה 📷</option>
              <option value="❤️">לב ❤️</option>
              <option value="💡">רעיון 💡</option>
              <option value="🔥">אש 🔥</option>
              <option value="⚡">ברק ⚡</option>
              <option value="none">ללא בועה</option>
            </select>
          </div>
        </div>

        <div class="stickers-bar">
          <span class="stickers-label">הוסף מדבקה:</span>
          <button type="button" class="sticker-chip" data-sticker="❤️">❤️</button>
          <button type="button" class="sticker-chip" data-sticker="✨">✨</button>
          <button type="button" class="sticker-chip" data-sticker="BOOM!">BOOM!</button>
          <button type="button" class="sticker-chip" data-sticker="WOW!">WOW!</button>
          <button type="button" class="sticker-chip clear-btn" id="clearStickersBtn">נקה מדבקות</button>
        </div>
      </section>

      <section class="preview-panel">
        <h2 class="preview-title">תוצאת הקומיקס שלך</h2>
        <div class="canvas-wrapper">
          <canvas id="comicCanvas" width="800" height="600"></canvas>
        </div>
        <span class="hint-text">טיפ: ניתן לגרור את בועת הדיבור, בועת המחשבה והמדבקות על גבי התמונה.</span>
      </section>
    </main>

    <footer class="bottom-actions">
      <button type="button" class="action-btn btn-apply" id="applyBtn">✨ החל אפקטים ויצירה!</button>
      <button type="button" class="action-btn btn-download" id="downloadBtn">⬇️ הורד כקובץ PNG</button>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
